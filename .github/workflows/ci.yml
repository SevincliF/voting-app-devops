name: CI

on:
    push:
        branches:
            - main

permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Lint helm chart
              run: helm lint helm/voting-app
            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Build and push vote image
              uses: docker/build-push-action@v7
              with:
                context: ./vote
                push: true
                tags: ghcr.io/sevinclif/voting-app-vote:latest
            - name: Build and push result image
              uses: docker/build-push-action@v7
              with:
                context: ./result
                push: true
                tags: ghcr.io/sevinclif/voting-app-result:latest
            - name: Build and push worker image
              uses: docker/build-push-action@v7
              with:
                context: ./worker
                push: true
                tags: ghcr.io/sevinclif/voting-app-worker:latest